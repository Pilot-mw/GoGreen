[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

# Netlify smart detection flags the SMTP env-var NAMES used by the
# contact-form function (SMTP_USER, SMTP_HOST, MAIL_FROM, CONTACT_EMAIL...).
# These are public config, not secrets. The false-positive safelist cannot be
# set here — Netlify requires SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES to be a
# dashboard env var (Site configuration > Environment variables):
#   value = MAIL_FROM,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASSWORD,SMTP_FROM,CONTACT_EMAIL,admin@gogreenmw.com,mail.spacemail.com

# The contact form posts directly to the Netlify function path below.
# On Netlify, /.netlify/functions/* is served by the Functions runtime and
# takes precedence over the SPA catch-all redirect.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; frame-src https://www.google.com; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self'; upgrade-insecure-requests"