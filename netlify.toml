[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[context.production.environment]
  RESEND_API_KEY = "re_54jVDHyg_MTCnmY3jk2HeHoVZDVJ5EJvP"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
